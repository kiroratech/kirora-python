[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "kirora"
dynamic = ["version"]
description = "Kirora SDK for Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Kirora and contributors" }]
keywords = ["kirora", "sdk", "api", "email", "push", "marketing", "transactional"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: AsyncIO",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.23.0,<1",
  "anyio>=3.5.0,<5",
  "typing-extensions>=4.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "trio>=0.22",
  "mypy>=1.10",
  "pyright>=1.1.380",
  "ruff>=0.6",
  "pytest-cov>=5",
]

[project.urls]
Homepage = "https://kirora.io/docs/sdks/python"
Documentation = "https://kirora.io/docs/sdks/python"
Repository = "https://github.com/kiroratech/kirora-python"
Issues = "https://github.com/kiroratech/kirora-python/issues"
Changelog = "https://github.com/kiroratech/kirora-python/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/kirora/version.py"

[tool.hatch.build.targets.sdist]
# Everything the tests and codegen read, so the extracted archive builds and tests alone.
include = [
  "src/kirora",
  "tests",
  "scripts",
  "spec",
  "examples",
  "docs",
  "README.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kirora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/kirora"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pyright]
include = ["src/kirora"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["src/kirora/types.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "UP006", "UP007", "UP035", "UP045",  # typing.List/Optional read fine and match the generated models
  "S101",                               # asserts in tests
  "RUF022",                             # __all__ is grouped by kind, not sorted
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S301", "B017"]
"scripts/**" = ["S310", "S603"]
# Nested `with`, as the usage guide writes it.
"examples/**" = ["SIM117"]
